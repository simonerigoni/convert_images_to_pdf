[project]
name = "convert-images-to-pdf"
version = "0.1.0"
description = "Convert images to pdf"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pillow>=12.2.0",
    "pyinstaller>=6.16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"