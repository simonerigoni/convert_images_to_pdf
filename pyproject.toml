[project]
name = "convert-images-to-pdf"
version = "0.1.0"
description = "Convert images to pdf"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "pillow>=12.2.0",
    "pyinstaller>=6.16.0",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/convert_images_to_pdf"
Repository = "https://github.com/simonerigoni/convert_images_to_pdf"
Medium = "https://medium.com/@simone-rigoni01/easily-convert-images-to-pdf-with-python-540093f38988"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"